version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: Europe/Belgrade
    open-pull-requests-limit: 10
    versioning-strategy: increase
    commit-message:
      prefix: deps
      prefix-development: deps-dev
    groups:
      astro:
        patterns:
          - astro
          - '@astrojs/*'
      formatting:
        patterns:
          - eslint
          - 'eslint-plugin-*'
          - '@stylistic/*'
          - typescript-eslint
          - prettier
          - 'prettier-plugin-*'
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # astro check does not support TypeScript 7 yet
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
